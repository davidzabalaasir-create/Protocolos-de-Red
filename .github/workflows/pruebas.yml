name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

# el CI solo lee el código; el token no necesita escribir nada en el repositorio
permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      # Chrome, móvil Android, Firefox, Safari e iPhone
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informe-e2e
          path: e2e-report
          retention-days: 7
